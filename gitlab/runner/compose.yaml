name: portfolio-web-gitlab-runner

services:
  runner:
    image: gitlab/gitlab-runner:alpine-v19.5.0
    container_name: portfolio-web-gitlab-runner
    restart: unless-stopped
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

  delivery-runner:
    image: gitlab/gitlab-runner:alpine-v19.5.0
    container_name: portfolio-web-gitlab-delivery-runner
    restart: unless-stopped
    volumes:
      - delivery-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  runner-config:
  delivery-runner-config:
